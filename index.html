<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBuddy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-container">
      <header class="hero">
        <h1>StudyBuddy</h1>
        <p>
          Convierte tu estudio en una aventura: completa actividades, gana puntos
          y ayuda a Mindy a evolucionar.
        </p>
      </header>

      <section class="status-card" aria-live="polite">
        <h2>Tus puntos actuales</h2>
        <p id="points" class="points">0</p>
      </section>

      <section class="pet-card">
        <h2>Tu mascota virtual: Mindy</h2>
        <div id="mindyEmoji" class="mindy-emoji" role="img" aria-label="Mindy dormida">😴</div>
        <p id="mindyState" class="mindy-state">Mindy está dormida. ¡Hora de estudiar!</p>
      </section>

      <section class="activities">
        <h2>Actividades</h2>
        <div class="buttons-grid">
          <button class="activity-btn" data-points="10">Flashcards (+10)</button>
          <button class="activity-btn" data-points="20">Multiple choice (+20)</button>
          <button class="activity-btn" data-points="30">Cuestionario (+30)</button>
        </div>
      </section>

      <section class="feedback">
        <p id="message">¡Bienvenido/a! Empieza una actividad para ganar puntos.</p>
      </section>

      <section class="reset-section">
        <button id="resetBtn" class="reset-btn">Reiniciar progreso</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
